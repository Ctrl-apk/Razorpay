services:
  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: ai-incident-investigator-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_PROVIDER
        value: stub
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-incident-db
          property: connectionString

  # ── Frontend ─────────────────────────────────────────────────────────────
  - type: web
    name: ai-incident-investigator
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ai-incident-investigator-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: ai-incident-db
    plan: free
    databaseName: incident_investigator
    user: incident
